name: 週次データ更新

on:
  schedule:
    # 毎週月曜 07:00 JST（＝日曜 22:00 UTC）
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "更新が無くても再構築する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: データを取得して再構築
        run: |
          python build/build_site.py ${{ inputs.force && '--force' || '' }}

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
          else
            KIJUNBI=$(python -c "import json;print(json.load(open('site/data/meta.json'))['sources']['youto']['kijunbi'] or '')")
            git commit -m "データ更新（都市計画決定 ${KIJUNBI} 現在）"
            git push
          fi
